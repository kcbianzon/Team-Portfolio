<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <title>TEMport Studio Tab Logo</title>
  <!-- Neo-brutalist Dandelion Yellow Tab Stamp Badge -->
  <rect width="64" height="64" rx="16" fill="#FFE600"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#212121" stroke-width="3" fill="none" opacity="0.18"/>

  <!-- Origami Paper Plane (Soaring Forward & Upward) -->
  <!-- Main Wing in Crisp Paper White with Solid Ink Outline -->
  <path d="M8 35L56 10L34 54L28 36L8 35Z" fill="#FFFFFF" stroke="#212121" stroke-width="4.2" stroke-linejoin="round"/>
  <!-- Inner Fold in Electric Violet with Contrast Outline -->
  <path d="M28 36L56 10L34 34L28 36Z" fill="#8168FD" stroke="#212121" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Keel Crease Line -->
  <path d="M28 36L24 45L31 41" stroke="#212121" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Subtle Studio Spark (Mint Lime) -->
  <circle cx="15" cy="15" r="3.5" fill="#93BA06" stroke="#212121" stroke-width="2"/>
</svg>
